<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TetraHub Scanner</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #657083; --border: #dfe3ea;
    --accent: #2563eb; --accent-soft: #e7eefe; --ok: #15803d; --ok-soft: #e3f4e8;
    --warn: #b45309; --warn-soft: #fdf1dc; --danger: #b91c1c;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --surface: #1a1f27; --text: #e6e9ef; --muted: #8e98a8; --border: #2c333f;
            --accent: #6b9bff; --accent-soft: #1f2b45; --ok: #4ade80; --ok-soft: #173024;
            --warn: #fbbf24; --warn-soft: #3a2c0f; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  h1 { margin: 0; font-size: 19px; }
  h2 { margin: 0 0 10px; font-size: 15px; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; padding: 18px 24px 32px;
         max-width: 1300px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  button, .btn { font: inherit; border-radius: 7px; padding: 7px 14px; cursor: pointer; text-decoration: none;
                 border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-block; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.stop { border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=password], input[type=number] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; width: 100%; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-weight: 500; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .cat { margin-top: 10px; }
  .cat:first-of-type { margin-top: 4px; }
  .cat-head { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; list-style: none;
              padding: 5px 2px; border-bottom: 1px solid var(--border); margin-bottom: 4px; user-select: none; }
  .cat-head::-webkit-details-marker { display: none; }
  .cat-head:hover { color: var(--accent); }
  .cat-head .chev { display: inline-block; width: 12px; color: var(--muted); transition: transform .15s; }
  .cat[open] > .cat-head .chev { transform: rotate(90deg); }
  .cat-head .title { flex: 1; }
  .cat-head .badge { font-size: 12px; font-weight: 400; color: var(--muted); }
  .cat-head .badge.on { color: var(--accent); }
  .cat-head button { padding: 1px 8px; font-size: 12px; font-weight: 400; }
  .cat:not([open]) > .cat-head { margin-bottom: 0; }
  /* une ligne = un bouton : clic pour la sélectionner (fond vert), re-clic pour la retirer.
     La case à cocher reste dans la page (état, clavier) mais n'est plus affichée. */
  .sec { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
         padding: 6px 8px; margin: 2px 0; border-radius: 6px; cursor: pointer; user-select: none;
         border: 1px solid transparent; transition: background .12s, border-color .12s; }
  .sec input { position: absolute; opacity: 0; pointer-events: none; }
  .sec:hover { background: var(--bg); border-color: var(--border); }
  .sec:has(input:checked) { background: var(--ok-soft); border-color: var(--ok); }
  .sec:has(input:checked) > span:first-of-type { color: var(--ok); font-weight: 600; }
  .sec:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sec .meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .sec .rec { color: var(--accent); font-size: 11.5px; margin-left: 6px; }
  .sec .twisty { display: inline-block; width: 18px; margin-right: 2px; text-align: center; color: var(--muted);
                 border-radius: 4px; transition: transform .15s; font-weight: 600; }
  .sec .twisty-space { display: inline-block; width: 18px; margin-right: 2px; }
  .sec .twisty:hover { background: var(--border); color: var(--text); }
  .sec .twisty.open { transform: rotate(90deg); }
  .sec .kids { color: var(--muted); font-size: 11.5px; margin-left: 8px; }
  .sec .kids.on { color: var(--accent); }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 3px; width: 70px; }
  .bar > i { display: block; height: 100%; background: var(--ok); }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .toolbar button { padding: 3px 10px; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .estimate { background: var(--accent-soft); border-radius: 7px; padding: 8px 10px; margin: 10px 0; font-size: 13px; }
  .log { font-family: var(--mono); font-size: 12px; background: var(--bg); border-radius: 7px; padding: 8px 10px;
         height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .update { max-width: 1300px; margin: 18px auto 0; padding: 12px 16px; border-radius: 10px;
            background: var(--accent-soft); border: 1px solid var(--accent); width: calc(100% - 48px); }
  .update ul { margin: 6px 0 0; padding-left: 20px; font-size: 13px; }
  .update a { color: var(--accent); margin-left: 6px; font-size: 13px; }
  .update code { font-family: var(--mono); font-size: 12.5px; background: var(--surface); padding: 1px 5px; border-radius: 4px; }
  .error { color: var(--danger); margin-top: 8px; min-height: 1em; }
  label.chk { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>TetraHub Scanner</h1>
    <div class="muted small" id="summary">Chargement…</div>
  </div>
  <div class="links">
    <a class="btn" href="/frequences" target="_blank" id="view">Voir les fréquences</a>
    <a class="btn" href="/frequences.csv">Télécharger le CSV</a>
  </div>
</header>

<div class="update" id="update" hidden>
  <div><b id="updTitle"></b> <a id="updLink" target="_blank" rel="noopener" hidden>voir sur GitHub ↗</a></div>
  <ul id="updList"></ul>
</div>

<main>
  <section class="card">
    <h2>Sections à scanner</h2>
    <div class="toolbar">
      <button id="selRec">Sections conseillées</button>
      <button id="selNone">Tout décocher</button>
      <button id="openAll">Tout déplier</button>
      <button id="closeAll">Tout replier</button>
    </div>
    <div class="muted small" style="margin-bottom:6px">Cocher une section scanne aussi ses sous-sections.</div>
    <div id="sections" class="muted">Chargement des sections…</div>
  </section>

  <div class="stack">
    <section class="card" id="account">
      <h2>Compte TetraHub</h2>
      <div id="accountBody"></div>
    </section>

    <section class="card">
      <h2>Scan</h2>
      <div class="row">
        <label class="field">Pause entre deux pages (s)
          <input id="delay" type="number" min="1.5" step="0.5" value="5"></label>
        <label class="field">Pages max par scan (0 = illimité)
          <input id="maxPages" type="number" min="0" step="50" value="300"></label>
      </div>
      <label class="chk small" style="margin-top:10px"><input id="full" type="checkbox">
        Rouvrir aussi les sujets inchangés</label>
      <div class="estimate" id="estimate"></div>
      <div class="row" style="align-items:center">
        <button class="primary" id="start">Lancer le scan</button>
        <button class="stop" id="stop" hidden>Arrêter</button>
      </div>
      <div class="error" id="err"></div>

      <div class="stats">
        <div class="stat"><b id="sPages">–</b><span>pages lues</span></div>
        <div class="stat"><b id="sTopics">–</b><span>sujets lus</span></div>
        <div class="stat"><b id="sSkipped">–</b><span>inchangés</span></div>
        <div class="stat"><b id="sNew">–</b><span>nouvelles fréq.</span></div>
      </div>
      <div class="muted small" id="phase"></div>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("th_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("th_" + k, JSON.stringify(v)); } catch {} },
};
let S = null, built = false, poll = null, FORUMS = [];

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-TetraHub": "1" }, body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Erreur");
  return data;
}

function selected() { return [...document.querySelectorAll("#sections input:checked")].map(i => i.value); }
function saveSelection() { store.set("forums", selected()); updateBadges(); estimate(); }

// "N cochées" dans l'en-tête de chaque catégorie, utile quand elle est repliée
function updateBadges() {
  // "14 sous-sections · 2 cochées" à côté d'une section qui en a
  for (const k of document.querySelectorAll("#sections .kids")) {
    const subs = FORUMS.filter(x => isDescendant(x.slug, k.dataset.slug, FORUMS));
    const n = subs.filter(x => document.querySelector(`#sections input[value="${x.slug}"]`)?.checked).length;
    k.textContent = `${subs.length} sous-section${subs.length > 1 ? "s" : ""}` + (n ? ` · ${n} cochée${n > 1 ? "s" : ""}` : "");
    k.classList.toggle("on", n > 0);
  }
  for (const cat of document.querySelectorAll("#sections .cat")) {
    const n = cat.querySelectorAll("input:checked").length;
    const b = cat.querySelector(".badge");
    b.textContent = n ? `${n} cochée${n > 1 ? "s" : ""}` : "";
    b.classList.toggle("on", n > 0);
  }
}

// Sections de l'accueil + sous-sections découvertes pendant les scans (certaines ne sont visibles
// qu'une fois connecté, comme celles de Fréquences VHF/UHF). Chaque sous-section suit sa section.
function forumList() {
  const list = S.forums.map(f => ({ ...f }));
  const bySlug = Object.fromEntries(list.map(f => [f.slug, f]));
  for (const [parent, subs] of Object.entries(S.tree || {})) {
    const p = bySlug[parent];
    if (!p) continue;
    for (const [slug, name] of subs) {
      if (bySlug[slug]) { bySlug[slug].parent = parent; continue; }
      // insérée après la section et ses sous-sections déjà listées
      let at = list.indexOf(p) + 1;
      while (at < list.length && list[at].sub && isDescendant(list[at].slug, parent, list)) at++;
      const f = { slug, name, category: p.category, topics: null, sub: true, parent };
      list.splice(at, 0, f); bySlug[slug] = f;
    }
  }
  return list;
}
function isDescendant(slug, ancestor, list) {
  for (let f = list.find(x => x.slug === slug); f && f.parent; f = list.find(x => x.slug === f.parent))
    if (f.parent === ancestor) return true;
  return false;
}
// sujets lus dans la section ET ses sous-sections (le total affiché par le forum les inclut aussi)
function readCount(slug, list) {
  return (S.progress[slug] || 0) + list.filter(f => f.parent === slug).reduce((n, f) => n + readCount(f.slug, list), 0);
}

let builtKey = "";
function buildSections() {
  FORUMS = forumList();
  builtKey = FORUMS.map(f => f.slug).join(",");
  const box = $("sections"); box.replaceChildren(); box.classList.remove("muted");
  const chosen = new Set(store.get("forums", S.recommended));
  const rec = new Set(S.recommended);
  // les catégories qui contiennent des sections conseillées passent en premier
  const cats = [...new Set(FORUMS.map(f => f.category))]
    .map((c, i) => [c, i - 1000 * FORUMS.filter(f => f.category === c && rec.has(f.slug)).length])
    .sort((a, b) => a[1] - b[1]).map(x => x[0]);
  const openState = store.get("open", {});
  for (const cat of cats) {
    // repliée par défaut si elle ne contient aucune section conseillée ; ensuite on retient le choix
    const wrap = document.createElement("details"); wrap.className = "cat";
    wrap.open = cat in openState ? openState[cat] : FORUMS.some(f => f.category === cat && rec.has(f.slug));
    wrap.ontoggle = () => { const o = store.get("open", {}); o[cat] = wrap.open; store.set("open", o); };
    const head = document.createElement("summary"); head.className = "cat-head";
    const chev = document.createElement("span"); chev.className = "chev"; chev.textContent = "›";
    const title = document.createElement("span"); title.className = "title"; title.textContent = cat;
    const badge = document.createElement("span"); badge.className = "badge";
    const all = document.createElement("button"); all.textContent = "tout";
    all.onclick = e => {
      e.preventDefault();  // ne pas replier/déplier en cliquant sur "tout"
      const boxes = [...wrap.querySelectorAll("input")];
      const check = !boxes.every(i => i.checked);   // 2e clic = tout décocher
      boxes.forEach(i => i.checked = check); saveSelection();
    };
    head.append(chev, title, badge, all); wrap.append(head);
    for (const f of FORUMS.filter(f => f.category === cat)) {
      const l = document.createElement("label"); l.className = "sec" + (f.sub ? " sub" : "");
      l.dataset.slug = f.slug;
      if (f.parent) l.dataset.parent = f.parent;
      l.style.marginLeft = (28 * depth(f)) + "px";   // décalage des sous-sections sous leur section
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = f.slug; cb.checked = chosen.has(f.slug);
      cb.onchange = saveSelection;
      const name = document.createElement("span");
      const kids = FORUMS.filter(x => x.parent === f.slug);
      if (kids.length) {
        // flèche pour dérouler les sous-sections (dans le <label> : on empêche le clic de cocher la case)
        const tw = document.createElement("span"); tw.className = "twisty"; tw.textContent = "›";
        tw.title = "Afficher / masquer les sous-sections";
        tw.onclick = e => { e.preventDefault(); e.stopPropagation(); toggleSub(f.slug); };
        name.append(tw);
      } else {
        // même largeur que la flèche, pour que tous les noms soient alignés
        const sp = document.createElement("span"); sp.className = "twisty-space"; name.append(sp);
      }
      name.append(f.name);
      if (rec.has(f.slug)) { const r = document.createElement("span"); r.className = "rec"; r.textContent = "conseillée"; name.append(r); }
      if (kids.length) {
        const k = document.createElement("span"); k.className = "kids"; k.dataset.slug = f.slug; name.append(k);
      }
      const meta = document.createElement("span"); meta.className = "meta"; meta.dataset.slug = f.slug;
      l.append(cb, name, meta); wrap.append(l);
    }
    box.append(wrap);
  }
  built = true;
  applyFold();
  updateBadges();
}

function depth(f) {
  let d = 0;
  for (let p = f; p && p.parent; p = FORUMS.find(x => x.slug === p.parent)) d++;
  return d;
}

// sous-sections repliées par défaut ; on retient ce qui a été déroulé
function toggleSub(slug) {
  const o = store.get("subopen", {}); o[slug] = !o[slug]; store.set("subopen", o); applyFold();
}
function applyFold() {
  const open = store.get("subopen", {});
  for (const row of document.querySelectorAll("#sections .sec")) {
    let hidden = false;
    for (let p = row.dataset.parent; p; p = FORUMS.find(x => x.slug === p)?.parent)
      if (!open[p]) { hidden = true; break; }
    row.hidden = hidden;
    row.querySelector(".twisty")?.classList.toggle("open", !!open[row.dataset.slug]);
  }
  updateBadges();
}

function updateProgress() {
  for (const m of document.querySelectorAll(".sec .meta")) {
    const f = FORUMS.find(x => x.slug === m.dataset.slug);
    const read = readCount(m.dataset.slug, FORUMS);
    m.replaceChildren();
    if (f.topics) {
      m.append(`${Math.min(read, f.topics)} / ${f.topics} sujets`);
      const bar = document.createElement("div"); bar.className = "bar";
      const i = document.createElement("i"); i.style.width = Math.min(100, 100 * read / f.topics) + "%";
      bar.append(i); m.append(bar);
    } else if (read) {
      m.textContent = `${read} sujets lus`;
    }
  }
}

function estimate() {
  if (!S) return;
  const delay = Math.max(1.5, parseFloat($("delay").value) || 5);
  const maxPages = parseInt($("maxPages").value) || 0;
  let pages = 0, unknown = false;
  const chosen = selected();
  for (const slug of chosen) {
    // une sous-section dont la section est cochée est déjà comptée avec elle
    if (chosen.some(other => other !== slug && isDescendant(slug, other, FORUMS))) continue;
    const f = FORUMS.find(x => x.slug === slug);
    if (!f || !f.topics) { unknown = true; continue; }
    const left = Math.max(0, f.topics - readCount(slug, FORUMS));
    pages += Math.ceil(f.topics / 40) + Math.round(left * 1.5);   // listes + ~1,5 page par sujet à lire
  }
  const capped = maxPages && pages > maxPages;
  const p = capped ? maxPages : pages;
  const min = Math.round(p * (delay + 0.5) / 60);
  // le forum ne donne pas le nombre de sujets des sous-sections : pas de faux "0 page" dans ce cas
  const limit = maxPages ? ` Ce scan s'arrêtera au plus à ${maxPages} pages (≈ ${Math.round(maxPages * (delay + 0.5) / 60)} min).` : "";
  const txt = chosen.length === 0 ? "Aucune section cochée." :
    pages === 0 && unknown ? `Durée inconnue : le forum n'indique pas le nombre de sujets de ces sous-sections.${limit}` :
    `Environ ${pages} pages à lire${unknown ? " (+ sous-sections)" : ""}` +
    (capped ? ` : ce scan s'arrêtera à ${maxPages} pages (≈ ${min || "< 1"} min), la suite au prochain.`
            : ` ≈ ${min || "< 1"} min.`) +
    (delay < 4 ? " Une pause courte charge davantage le forum." : "");
  $("estimate").textContent = txt;
}

let accountKey = null;
function renderAccount() {
  // reconstruit seulement si l'état change, sinon on effacerait ce que l'utilisateur est en train de taper
  const key = `${S.user}|${S.running}`;
  if (key === accountKey) return;
  accountKey = key;
  const b = $("accountBody"); b.replaceChildren();
  if (S.user) {
    const p = document.createElement("div"); p.className = "row"; p.style.alignItems = "center";
    const pill = document.createElement("span"); pill.className = "pill ok"; pill.textContent = "Connecté : " + S.user;
    const out = document.createElement("button"); out.textContent = "Se déconnecter"; out.style.flex = "0 0 auto";
    out.disabled = S.running;
    out.onclick = async () => { try { S = await api("/api/logout", {}); render(); } catch (e) { $("err").textContent = e.message; } };
    p.append(pill, out); b.append(p);
    return;
  }
  const form = document.createElement("form");
  form.innerHTML = `<div class="row">
      <label class="field">Pseudo<input type="text" name="u" autocomplete="username" required></label>
      <label class="field">Mot de passe<input type="password" name="p" autocomplete="current-password" required></label>
      <button class="primary" style="flex:0 0 auto">Se connecter</button></div>
    <div class="muted small" style="margin-top:8px">Le mot de passe n'est pas enregistré : seule la connexion est gardée (session.json).</div>`;
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Connexion…"; $("err").textContent = "";
    try { S = await api("/api/login", { username: form.u.value, password: form.p.value }); render(); }
    catch (err) { $("err").textContent = err.message; btn.disabled = false; btn.textContent = "Se connecter"; form.p.value = ""; }
  };
  const warn = document.createElement("div"); warn.className = "pill warn"; warn.style.marginBottom = "10px";
  warn.textContent = "Pas connecté : le forum exige un compte pour lire les sujets";
  b.append(warn, form);
}

function render() {
  if (!S) return;
  $("summary").textContent = `${S.frequencies} fréquences enregistrées` + (S.user ? ` · ${S.user}` : "");
  // bandeau "nouvelle version" quand GitHub a des changements pas encore récupérés
  const up = S.update;
  $("update").hidden = !(up && up.behind > 0);
  if (up && up.behind > 0) {
    $("updTitle").textContent = `Nouvelle version disponible (${up.behind} changement${up.behind > 1 ? "s" : ""})`;
    $("updLink").hidden = !up.url;
    if (up.url) $("updLink").href = up.url + "/commits";  // liste des changements sur GitHub
    $("updList").replaceChildren(...up.titles.map(t => { const li = document.createElement("li"); li.textContent = t; return li; }));
  }
  $("view").textContent = `Voir les fréquences (${S.frequencies})`;
  // reconstruit la liste si un scan a découvert de nouvelles sous-sections (les cases cochées sont mémorisées)
  if (S.forums.length && (!built || forumList().map(f => f.slug).join(",") !== builtKey)) buildSections();
  if (built) updateProgress();
  renderAccount();
  const st = S.stats || {};
  $("sPages").textContent = S.started ? S.pages : "–";
  $("sTopics").textContent = st.topics ?? "–";
  $("sSkipped").textContent = st.skipped ?? "–";
  $("sNew").textContent = st.new ?? "–";
  $("start").hidden = S.running; $("start").disabled = !S.user;
  $("stop").hidden = !S.running; $("stop").disabled = S.stopping;
  $("stop").textContent = S.stopping ? "Arrêt en cours…" : "Arrêter";
  $("phase").textContent = S.running
    ? `En cours depuis ${Math.round((Date.now() / 1000 - S.started) / 60)} min — section : ${st.forum || "…"}`
    : S.finished ? `Terminé à ${new Date(S.finished * 1000).toLocaleTimeString("fr-FR")}` : "";
  const log = $("log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
  log.textContent = S.log.join("\n") || "Le journal du scan s'affichera ici.";
  if (atBottom) log.scrollTop = log.scrollHeight;
  estimate();
  clearTimeout(poll); poll = setTimeout(refresh, S.running ? 1000 : 5000);
}

async function refresh() {
  try { S = await api("/api/status"); render(); }
  catch { $("summary").textContent = "Serveur arrêté : relance python web.py"; clearTimeout(poll); poll = setTimeout(refresh, 5000); }
}

$("start").onclick = async () => {
  $("err").textContent = "";
  store.set("delay", $("delay").value); store.set("maxPages", $("maxPages").value);
  try {
    S = await api("/api/scan", { forums: selected(), delay: parseFloat($("delay").value),
                                 max_pages: parseInt($("maxPages").value) || 0, full: $("full").checked });
    render();
  } catch (e) { $("err").textContent = e.message; }
};
$("stop").onclick = async () => { try { S = await api("/api/stop", {}); render(); } catch (e) { $("err").textContent = e.message; } };
$("selRec").onclick = () => { document.querySelectorAll("#sections input").forEach(i => i.checked = S.recommended.includes(i.value)); saveSelection(); };
$("selNone").onclick = () => { document.querySelectorAll("#sections input").forEach(i => i.checked = false); saveSelection(); };
$("openAll").onclick = () => document.querySelectorAll("#sections .cat").forEach(d => d.open = true);
$("closeAll").onclick = () => document.querySelectorAll("#sections .cat").forEach(d => d.open = false);
$("delay").value = store.get("delay", 5); $("maxPages").value = store.get("maxPages", 300);
$("delay").oninput = $("maxPages").oninput = estimate;
refresh();
</script>
</body>
</html>
